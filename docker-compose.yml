services:
  decision-engine:
    build:
      context: .
      target: runtime
    image: tradepay/decision-engine:local
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 2s
      retries: 3

  tests:
    build:
      context: .
      target: deps
    profiles: ["test"]
    volumes:
      - .:/srv
    command: python -m pytest -v
